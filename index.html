<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Night Shift — Procedural Dock</title>
<style>
  html, body { margin: 0; height: 100%; background: #000; overflow: hidden; }
  canvas { display: block; width: 100vw; height: 100vh; cursor: grab; }
  canvas:active { cursor: grabbing; }
  #hud { position: fixed; left: 16px; bottom: 14px; color: rgba(220, 228, 235, .62); font: 11px/1.6 ui-monospace, Consolas, monospace;
         letter-spacing: .04em; pointer-events: none; text-shadow: 0 1px 2px #000; white-space: pre; transition: opacity .6s; }
  #title { position: fixed; left: 28px; top: 24px; color: rgba(235, 238, 240, .85); font: 300 13px/1.5 "Segoe UI", system-ui, sans-serif;
           letter-spacing: .42em; text-transform: uppercase; pointer-events: none; transition: opacity 3s; text-shadow: 0 1px 6px #000; }
  #title small { display: block; font-size: 10px; letter-spacing: .3em; opacity: .55; margin-top: 4px; }
  #err { position: fixed; inset: 0; display: none; align-items: center; justify-content: center; color: #f88; background: #000;
         font: 13px/1.5 ui-monospace, Consolas, monospace; white-space: pre-wrap; padding: 40px; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<div id="title">Night Shift<small>procedural · from-scratch WebGL2 engine</small></div>
<div id="hud"></div>
<div id="err"></div>
<script src="src/math.js?v=5"></script>
<script src="src/glutil.js?v=5"></script>
<script src="src/mesh.js?v=5"></script>
<script src="src/shaders.js?v=5"></script>
<script src="src/world.js?v=5"></script>
<script src="src/main.js?v=5"></script>
</body>
</html>
